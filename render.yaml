services:
  - type: web
    name: sentinel-k4-firefox
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r codebase/requirements.txt
    startCommand: gunicorn --chdir codebase app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: LLM_PROVIDER
        value: openai-compatible
      - key: LLM_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai
      - key: LLM_MODEL
        value: gemini-flash-latest
      - key: LLM_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

